plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.dali951.studysessions'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dali951.studysessions'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs = ['www']
        }
    }
}
