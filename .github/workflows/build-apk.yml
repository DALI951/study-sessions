name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run logic tests
        run: node --test tests/*.test.mjs

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        run: |
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip
          echo "$GITHUB_WORKSPACE/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist
          APK=$(find "$GITHUB_WORKSPACE" -type f -name '*.apk' | head -n 1)
          echo "Built APK: $APK"
          test -n "$APK"
          cp "$APK" dist/study-sessions-v1.0.0.apk
          ls -lh dist/study-sessions-v1.0.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: study-sessions-apk
          path: dist/study-sessions-v1.0.0.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish APK on the v1.0.0 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.0.0 >/dev/null 2>&1 || gh release create v1.0.0 \
            --title "Study Log v1.0.0" \
            --notes "Offline study-session tracker. Add subjects, log sessions, see them on the calendar." \
            dist/study-sessions-v1.0.0.apk
          gh release upload v1.0.0 dist/study-sessions-v1.0.0.apk --clobber
